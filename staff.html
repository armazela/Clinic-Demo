<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>პერსონალი – კლინიკა</title>
<style>
:root{--bg:#f3f7f6;--card:#fff;--ink:#17302e;--mute:#64807c;--line:#dbe6e3;--brand:#0f766e;
--day:#fde68a;--day-i:#7a5b00;--night:#bfdbfe;--night-i:#1e3a8a;--rest:#e5e7eb;--rest-i:#4b5563;
--ok:#15803d;--bad:#b91c1c;--badbg:#fee2e2}
*{box-sizing:border-box}
body{margin:0;font-family:"Noto Sans Georgian","BPG Nino Mtavruli",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--brand);color:#fff;padding:10px 16px}
.top b{font-size:18px;margin-right:auto}
.top a,.top button{color:#fff;background:rgba(255,255,255,.15);border:0;border-radius:8px;padding:7px 12px;font:inherit;font-size:14px;text-decoration:none;cursor:pointer}
.top a.on{background:#fff;color:var(--brand)}
main{display:grid;grid-template-columns:1fr 300px;gap:16px;padding:16px;max-width:1300px;margin:auto}
section,aside{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
h1,h2{margin:0 0 10px;font-size:18px}
.legend{display:flex;gap:8px;flex-wrap:wrap;font-size:13px;margin-bottom:10px;color:var(--mute)}
.wrap{overflow-x:auto}
table{border-collapse:separate;border-spacing:4px;width:100%;min-width:640px}
th{font-size:13px;color:var(--mute);font-weight:600;padding:4px}
td.n{text-align:left;font-size:13px;white-space:nowrap;padding-right:8px}
td.n small{display:block;color:var(--mute)}
.chip{width:100%;border:0;border-radius:8px;padding:8px 2px;font:inherit;font-size:12px;cursor:pointer;min-height:36px}
.chip.d{background:var(--day);color:var(--day-i)}
.chip.n{background:var(--night);color:var(--night-i)}
.chip.r{background:var(--rest);color:var(--rest-i)}
.chip:focus-visible,button:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
tr.sum td{font-size:12px;text-align:center;padding:4px 0}
.cnt{border-radius:8px;padding:4px 2px;background:#ecfdf5;color:var(--ok)}
.cnt.low{background:var(--badbg);color:var(--bad);font-weight:700}
.req{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px}
.req p{margin:0 0 4px;font-size:14px}.req small{color:var(--mute)}
.btns{display:flex;gap:8px;margin-top:8px}
.btns button{flex:1;border:0;border-radius:8px;padding:8px;font:inherit;font-size:13px;cursor:pointer}
.yes{background:var(--ok);color:#fff}.no{background:var(--bad);color:#fff}
.st{display:inline-block;margin-top:6px;font-size:12px;padding:3px 8px;border-radius:99px}
.st.w{background:#fef3c7;color:#92400e}.st.a{background:#dcfce7;color:var(--ok)}.st.x{background:var(--badbg);color:var(--bad)}
@media(max-width:800px){main{grid-template-columns:1fr;padding:10px}}
</style>
</head>
<body>
<header class="top">
  <b>კლინიკა · პერსონალი</b>
  <a class="on" href="staff.html">გრაფიკი</a>
  <a href="inventory.html">მარაგები</a>
  <button id="reset">Reset</button>
</header>
<main>
  <section>
    <h1>კვირის გრაფიკი</h1>
    <div class="legend">დააჭირეთ უჯრას შესაცვლელად:
      <span>🟨 დღის ცვლა</span><span>🟦 ღამის ცვლა</span><span>⬜ დასვენება</span></div>
    <div class="wrap"><table id="grid"></table></div>
  </section>
  <aside>
    <h2>შვებულების მოთხოვნები</h2>
    <div id="reqs"></div>
  </aside>
</main>
<script>
const DAYS=['ორშ','სამ','ოთხ','ხუთ','პარ','შაბ','კვი'];
const STAFF=[
['ნინო ქავთარაძე','ექიმი'],['გიორგი მამულაშვილი','ექიმი'],['ლევან ბერიძე','ექიმი'],['თამარ ჯაფარიძე','ექიმი'],
['მარიამ გელაშვილი','ექთანი'],['ეკა ლომიძე','ექთანი'],['დავით წერეთელი','ექთანი'],['სოფო აბაშიძე','ექთანი'],['ანა კვარაცხელია','ექთანი'],
['ლიკა ხარაიშვილი','ადმინისტრატორი'],['ირაკლი ჩხეიძე','ადმინისტრატორი'],['მაკა თათარაშვილი','ადმინისტრატორი']];
const CLS=['d','n','r'],TXT={d:'დღის ცვლა',n:'ღამის ცვლა',r:'დასვენება'};
const SHORT={d:'დღე',n:'ღამე',r:'დასვ.'};
// initial pattern, invented
const initial=()=>STAFF.map((_,i)=>DAYS.map((_,j)=>((i+j)%7===0||(i*2+j)%7===3)?'r':((i+j)%5===0?'n':'d')));
const initReqs=()=>[
{who:'ნინო ქავთარაძე',period:'3–10 ნოემბერი',s:'w'},
{who:'მარიამ გელაშვილი',period:'15–18 ნოემბერი',s:'w'},
{who:'ლიკა ხარაიშვილი',period:'1–5 დეკემბერი',s:'w'}];
let plan=initial(),reqs=initReqs();
const ST={w:'მოლოდინში',a:'დადასტურებულია',x:'უარყოფილია'};
function render(){
  let h='<tr><th></th>'+DAYS.map(d=>`<th>${d}</th>`).join('')+'</tr>';
  STAFF.forEach((p,i)=>{
    h+=`<tr><td class="n">${p[0]}<small>${p[1]}</small></td>`+
    plan[i].map((c,j)=>`<td><button class="chip ${c}" data-i="${i}" data-j="${j}" aria-label="${p[0]}, ${DAYS[j]}: ${TXT[c]}">${SHORT[c]}</button></td>`).join('')+'</tr>';
  });
  [['ექიმი','ექიმები'],['ექთანი','ექთნები']].forEach(([role,label])=>{
    h+=`<tr class="sum"><td class="n">${label} სამუშაოზე</td>`+DAYS.map((_,j)=>{
      const n=STAFF.reduce((a,p,i)=>a+(p[1]===role&&plan[i][j]!=='r'?1:0),0);
      return `<td><div class="cnt ${n<2?'low':''}">${n}</div></td>`}).join('')+'</tr>';
  });
  document.getElementById('grid').innerHTML=h;
  document.getElementById('reqs').innerHTML=reqs.map((r,k)=>`
    <div class="req"><p><b>${r.who}</b></p><small>${r.period}</small><br>
    <span class="st ${r.s}">${ST[r.s]}</span>
    <div class="btns"><button class="yes" data-k="${k}" data-v="a">დადასტურება</button><button class="no" data-k="${k}" data-v="x">უარყოფა</button></div></div>`).join('');
}
document.addEventListener('click',e=>{
  const c=e.target.closest('.chip');
  if(c){const{i,j}=c.dataset;plan[i][j]=CLS[(CLS.indexOf(plan[i][j])+1)%3];render();
    document.querySelector(`.chip[data-i="${i}"][data-j="${j}"]`).focus();return}
  const b=e.target.closest('[data-k]');
  if(b){reqs[b.dataset.k].s=b.dataset.v;render()}
});
document.getElementById('reset').onclick=()=>{plan=initial();reqs=initReqs();render()};
render();
</script>
</body>
</html>
